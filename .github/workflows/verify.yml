name: verify changes

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify the changes
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: lint the Dockerfiles
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - name: lint the shell scripts
        run: shellcheck entrypoint.sh

  build:
    name: build the image and smoke-test it
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container

      - name: run the BuildKit Dockerfile checks
        run: docker buildx bake --check

      - name: build the amd64 image
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          targets: default
          load: true
          push: false
          set: |
            *.platform=linux/amd64
            *.tags=github-runner:verify

      - name: smoke-test the image
        run: |
          set -euo pipefail
          image=github-runner:verify

          # the runner starts only if installdependencies.sh found every library
          # it needs, and the version must match what the tags and labels claim
          expected=$(docker buildx bake --print image | jq -r '.target.image.args.RUNNER_VERSION')
          actual=$(docker run --rm --entrypoint ./bin/Runner.Listener "$image" --version)
          echo "runner version: ${actual} (expected ${expected})"
          [ "$actual" = "$expected" ]

          # the entrypoint must refuse to start without its configuration
          if output=$(docker run --rm "$image" 2>&1); then
            echo "entrypoint started without GH_RUNNER_URL"; exit 1
          fi
          grep -q 'need GH_RUNNER_URL' <<<"$output"

          # workflows rely on passwordless apt-get through sudo
          docker run --rm --entrypoint sudo "$image" -n apt-get --version > /dev/null
